<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>55형 평면도</title>
<style>
  :root{--bg:#fff;--wall:#111;--room:#f7f7f4;--wet:#e3eef5;--bal:#ebf2e6;--dim:#c0392b;--txt:#111}
  body{margin:0;background:var(--bg);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--txt)}
  header{padding:12px 16px}
  h1{font-size:18px;margin:0 0 4px}
  p{margin:0;font-size:12px;color:#666}
  svg{width:100%;max-width:960px;height:auto;display:block;margin:0 auto}
  .room{stroke:#333;stroke-width:30}
  .wall{fill:none;stroke:var(--wall);stroke-width:180;stroke-linejoin:miter}
  .lbl{font-size:300px;font-weight:700;text-anchor:middle;fill:var(--txt)}
  .area{font-size:170px;text-anchor:middle;fill:#666}
  .sm{font-size:140px;text-anchor:middle;fill:#444}
  .dim line{stroke:var(--dim);stroke-width:18}
  .dim .tick{stroke-width:24}
  .dim text{fill:var(--dim);font-size:190px;font-weight:700;text-anchor:middle}
  .door{fill:none;stroke:#666;stroke-width:20}
  .fx{fill:#fff;stroke:#333;stroke-width:25}
  .grid line{stroke:#000;stroke-opacity:.05;stroke-width:8}
</style>
</head>
<body>
<header>
  <h1>■ 55형 평면도 — 축척 1:1 mm 좌표</h1>
  <p>모든 좌표는 mm 단위입니다(1 SVG 단위 = 1mm). 격자 간격 500mm. 칸막이벽 두께는 200mm로 가정했습니다.</p>
</header>
<svg id="plan" viewBox="-900 -1900 11600 13000" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("plan");
const el = (tag, attrs, parent = svg, text) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  parent.appendChild(e); return e;
};

// 격자 (500mm)
const g = el("g", {class: "grid"});
for (let x = -500; x <= 10500; x += 500) el("line", {x1: x, y1: -1500, x2: x, y2: 10500}, g);
for (let y = -1500; y <= 10500; y += 500) el("line", {x1: -500, y1: y, x2: 10500, y2: y}, g);

// 실: [이름, x, y, 폭, 깊이, 채움, 면적표시]
const R = "var(--room)", W = "var(--wet)", B = "var(--bal)", S = "#fff";
const rooms = [
  ["침실2",    0,    0, 2600, 2850, R, true],
  ["에어컨",   0, 2950, 1600,  400, S],
  ["욕실2",    0, 3450, 1600, 1600, W, true, 0, 400],
  ["주방",  2800, -200, 2000, 4150, R, true, 300, 900],
  ["수납",  4800, 1100,  700, 2850, S],
  ["발코니2",4800,-1000, 2100, 1900, B, false, -500, 650],
  ["욕실1", 5600, 1600, 1550, 2150, W, true, 250, 300],
  ["복도",  1600, 3950, 6350, 1100, R],
  ["현관",  7950, 3650, 1250, 1400, R],
  ["신발장",9200, 3650,  600, 1400, S],
  ["안방",     0, 5250, 3400, 3000, R, true, -500, 0],
  ["거실",  3600, 5050, 3200, 3700, R, true],
  ["침실1", 7000, 5250, 2800, 3350, R, true],
  ["옷장",  7900, 5250, 1100,  650, S],
  ["발코니1",1800, 8450, 1400, 1600, B],
  ["대피공간",  0, 8450, 1600, 1350, B],
];
for (const [n, x0, y0, w, h, f, a, ox = 0, oy = 0] of rooms) {
  const x = x0, y = y0;
  el("rect", {class: "room", x, y, width: w, height: h, fill: f});
  const small = w < 1300 || h < 800;
  el("text", {class: small ? "sm" : "lbl", x: x + w / 2 + ox, y: y + h / 2 + oy + (small ? 50 : 0)}, svg, n);
  if (a) el("text", {class: "area", x: x + w / 2 + ox, y: y + h / 2 + oy + 260}, svg, (w * h / 1e6).toFixed(2) + " ㎡");
}

// 외벽
el("polyline", {class: "wall", points: [
  [0,0],[2700,0],[2700,-200],[4800,-200],[4800,-1000],[6900,-1000],[6900,1500],[7250,1500],
  [7250,3650],[9900,3650],[9900,8750],[3500,8750],[3500,8350],[3200,8350],[3200,10050],[0,10050],[0,0]
].map(p => p.join(",")).join(" ")});

// 설비
const fx = (tag, a) => el(tag, Object.assign({class: "fx"}, a));
fx("rect", {x: 3550, y: -150, width: 1000, height: 550, rx: 60});   // 싱크
fx("circle", {cx: 4050, cy: 125, r: 80});
fx("rect", {x: 2850, y: 1500, width: 600, height: 600});            // 쿡탑
for (const [cx, cy] of [[3000,1650],[3300,1650],[3000,1950],[3300,1950]]) fx("circle", {cx, cy, r: 90});
fx("rect", {x: 5700, y: 1650, width: 1400, height: 700, rx: 250});  // 욕조
fx("rect", {x: 5650, y: 2500, width: 500, height: 450});            // 세면대
fx("ellipse", {cx: 5950, cy: 3400, rx: 220, ry: 300});              // 변기
fx("ellipse", {cx: 350, cy: 3900, rx: 220, ry: 300});
fx("rect", {x: 900, y: 3550, width: 500, height: 450});
fx("rect", {x: 5850, y: -900, width: 1000, height: 1000});          // 세탁기 자리
el("line", {class: "door", x1: 5850, y1: -900, x2: 6850, y2: 100});
el("line", {class: "door", x1: 6850, y1: -900, x2: 5850, y2: 100});
el("text", {class: "sm", x: 6350, y: 300}, svg, "세탁기 1000×1000");
fx("rect", {x: 300, y: 9350, width: 1000, height: 350});
el("text", {class: "sm", x: 800, y: 9570}, svg, "실외기");

// 문: [힌지x, 힌지y, 폭, 시작각, 끝각]  (각도: 0=+x, 90=+y)
const doors = [
  [1650, 3950,  900, -90,   0],   // 침실2
  [1600, 5250,  750, 180, 270],   // 욕실2
  [2400, 5250,  900,   0,  90],   // 안방
  [7150, 3750,  750, 180, 270],   // 욕실1
  [7050, 5250,  900,   0,  90],   // 침실1
  [8000, 3650, 1050, -90,   0],   // 현관
  [1800, 9800,  700, -90,   0],   // 발코니1→대피
];
for (const [hx, hy, w, a0, a1] of doors) {
  const p = a => [hx + w * Math.cos(a * Math.PI / 180), hy + w * Math.sin(a * Math.PI / 180)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  el("path", {class: "door", d: `M${hx},${hy} L${x0},${y0} A${w},${w} 0 0 1 ${x1},${y1}`});
}

// 창/문 규격
const notes = [
  [1300, -350, "창문 1500×1200 (커튼박스 180)"], [4050, -450, "창문 1000×1200"],
  [5850, -1200, "창문 600×900"], [5200, 9050, "창문 2600×2000 (커튼박스 180)"],
  [8400, 8950, "창문 1800×1200"], [800, 10400, "그릴 1100×2100"],
  [2500, 10400, "창문 1300×2000"], [2500, 8300, "문 1400×2400"],
  [8575, 3500, "문 1050×2200"],
];
for (const [x, y, t] of notes) el("text", {class: "sm", x, y}, svg, t);

// 치수선: [x1, y1, x2, y2, 라벨]
const D = el("g", {class: "dim"});
const dim = (x1, y1, x2, y2, t) => {
  el("line", {x1, y1, x2, y2}, D);
  const v = x1 === x2;
  for (const [x, y] of [[x1, y1], [x2, y2]])
    el("line", {class: "tick", x1: x - 90, y1: y + 90, x2: x + 90, y2: y - 90}, D);
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  el("text", v ? {x: mx - 70, y: my, transform: `rotate(-90 ${mx - 70} ${my})`} : {x: mx, y: my - 70}, D, t);
};
const chain = (pts, y, labels) => { for (let i = 0; i < labels.length; i++) dim(pts[i], y, pts[i + 1], y, labels[i]); };
const vchain = (pts, x, labels) => { for (let i = 0; i < labels.length; i++) dim(x, pts[i], x, pts[i + 1], labels[i]); };

dim(0, 1950, 2600, 1950, "2600");
chain([0, 1600, 2600], 2350, ["1600", "1000"]);
chain([2800, 3500, 4800, 5500], 1950, ["700", "1300", "700"]);
dim(2200, 0, 2200, 2850, "2850");
vchain([-200, 2350, 3950], 4300, ["2550", "1600"]);
dim(2200, 2950, 2200, 3950, "1020");
chain([1600, 2800, 4800, 7950], 4350, ["1200", "2000", "3150"]);
dim(1600, 4800, 3600, 4800, "2000");
dim(6800, 4800, 7950, 4800, "1150");
dim(6200, 3950, 6200, 5050, "1100");
dim(2200, 5250, 2200, 8250, "3000");
dim(6200, 5050, 6200, 8750, "3500");
dim(8700, 5900, 8700, 8600, "2700");
dim(9500, 5250, 9500, 8600, "3350");
dim(8700, 5250, 8700, 5900, "650");
dim(0, 7800, 3400, 7800, "3400");
dim(3600, 7800, 6800, 7800, "3200");
dim(7000, 7800, 9800, 7800, "2800");
</script>
</body>
</html>
