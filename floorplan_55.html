<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>55형 평면도</title>
<style>
  :root{--bg:#fff;--wall:#111;--room:#f7f7f4;--wet:#e3eef5;--bal:#ebf2e6;--dim:#c0392b;--txt:#111}
  body{margin:0;background:var(--bg);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--txt)}
  header{padding:12px 16px}
  h1{font-size:18px;margin:0 0 4px}
  p{margin:0 0 8px;font-size:12px;color:#666}
  label{font-size:13px;margin-right:12px}
  svg{width:100%;max-width:960px;height:auto;display:block;margin:0 auto}
  .room{stroke:none}
  .lbl{font-size:260px;font-weight:700;text-anchor:middle;fill:var(--txt)}
  .area{font-size:150px;text-anchor:middle;fill:#666}
  .sm{font-size:120px;text-anchor:middle;fill:#444}
  .dim line{stroke:var(--dim);stroke-width:16}
  .dim text{fill:var(--dim);font-size:170px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:40px}
  .door{fill:none;stroke:#555;stroke-width:18}
  .fx{fill:#fff;stroke:#333;stroke-width:22}
</style>
</head>
<body>
<header>
  <h1>■ 55형 평면도 — 원본 정합 벡터 (1 SVG 단위 = 1mm)</h1>
  <p>원본 이미지의 벽선을 픽셀 단위로 추출해 좌표화했습니다. 축척은 치수선(2600+700+1300+700=5300)에서 구한 1px = 12.6mm입니다.</p>
  <label>원본 겹쳐보기 <input id="op" type="range" min="0" max="100" value="0"></label>
  <label><input id="ex" type="checkbox"> 차이 강조(원본 빨강/벡터 파랑)</label>
</header>
<svg id="plan" viewBox="-500 -1500 10400 11900" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("plan");
const el = (tag, attrs, parent = svg, text) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  parent.appendChild(e); return e;
};
// 원본 이미지 픽셀 → mm (원점: 침실2 내부 좌상단 px(25,243))
const S = 12.6, OX = 25, OY = 243;
const X = px => Math.round((px - OX) * S), Y = py => Math.round((py - OY) * S);
const L = v => Math.round(v * S);

const plan = el("g", {id: "vec"});

// 외벽 외곽 (채운 뒤 실을 얹으면 빈 틈이 벽이 됨)
const outer = [[10,216],[178,216],[178,157],[567,157],[567,309],[601,309],[601,501],[783,501],
               [783,918],[306,918],[306,1010],[10,1010]];
el("polygon", {points: outer.map(([x, y]) => X(x) + "," + Y(y)).join(" "), fill: "var(--wall)"}, plan);

// 실: [이름, x1, y1, x2, y2(px), 채움, 면적표시, 라벨 오프셋 dx, dy(px)]
const R = "var(--room)", W = "var(--wet)", B = "var(--bal)", F = "#fff";
const rooms = [
  ["침실2",   25, 243, 223, 459, R, 1, 0, -20],
  ["",        25, 469, 136, 504, F],
  ["욕실2",   34, 515, 136, 631, W, 1, -10, 25],
  ["",       237, 180, 379, 332, R],
  ["주방",   237, 332, 389, 546, R, 1, 15, 0],
  ["수납",   389, 331, 443, 546, F],
  ["발코니2",394, 172, 566, 309, B, 0, -35, 20],
  ["",       453, 309, 601, 331, F],
  ["",       567, 309, 601, 546, F],
  ["욕실1",  453, 365, 567, 532, W, 1, 25, 10],
  ["",       453, 532, 628, 546, R],
  ["복도",   148, 546, 628, 630, R],
  ["현관",   628, 525, 729, 630, R],
  ["신발장", 729, 525, 768, 630, F],
  ["안방",    25, 641, 284, 869, R, 1, -45, 0],
  ["거실",   299, 630, 540, 895, R, 1],
  ["침실1",  556, 641, 768, 895, R, 1, -30, 30],
  ["옷장",   657, 641, 768, 690, F],
  ["",       299, 895, 783, 917, F],
  ["",       556, 895, 768, 906, F],
  ["",        25, 869, 170, 896, F],
  ["발코니1",170, 885, 280, 991, B],
  ["대피공간", 25, 896, 159, 995, B, 0, 22, -10],
];
for (const [n, x1, y1, x2, y2, f, a, dx = 0, dy = 0] of rooms) {
  el("rect", {class: "room", x: X(x1), y: Y(y1), width: L(x2 - x1), height: L(y2 - y1), fill: f}, plan);
  if (!n) continue;
  const cx = X((x1 + x2) / 2 + dx), cy = Y((y1 + y2) / 2 + dy);
  const small = n === "대피공간" || (x2 - x1) < 90 || (y2 - y1) < 60;
  el("text", {class: small ? "sm" : "lbl", x: cx, y: cy + (small ? 40 : 0)}, plan, n);
  if (a) el("text", {class: "area", x: cx, y: cy + 220}, plan, (L(x2 - x1) * L(y2 - y1) / 1e6).toFixed(2) + " ㎡");
}

// 설비 (px)
const fx = (tag, a) => el(tag, Object.assign({class: "fx"}, a), plan);
const box = (x1, y1, x2, y2, extra = {}) => fx("rect", Object.assign({x: X(x1), y: Y(y1), width: L(x2 - x1), height: L(y2 - y1)}, extra));
box(304, 192, 365, 225, {rx: 50}); fx("circle", {cx: X(334), cy: Y(208), r: L(6)});
box(249, 298, 287, 343);
for (const [x, y] of [[259,309],[277,309],[259,332],[277,332]]) fx("circle", {cx: X(x), cy: Y(y), r: L(5)});
box(464, 370, 560, 414, {rx: 200});
box(463, 426, 497, 466);
fx("ellipse", {cx: X(485), cy: Y(500), rx: L(18), ry: L(23)});
fx("ellipse", {cx: X(58), cy: Y(552), rx: L(17), ry: L(24)});
box(88, 529, 128, 557);
box(487, 232, 546, 294);
el("path", {class: "door", d: `M${X(487)},${Y(232)}L${X(546)},${Y(294)}M${X(546)},${Y(232)}L${X(487)},${Y(294)}`}, plan);
box(192, 172, 219, 221);
el("path", {class: "door", d: `M${X(192)},${Y(172)}L${X(219)},${Y(221)}M${X(219)},${Y(172)}L${X(192)},${Y(221)}`}, plan);
box(37, 907, 87, 959); box(60, 967, 125, 989);
el("text", {class: "sm", x: X(92), y: Y(983)}, plan, "실외기");
el("text", {class: "sm", x: X(565), y: Y(325)}, plan, "세탁기 1000×1000");

// 문: [힌지x, 힌지y, 반경(px), 시작각, 끝각]
const doors = [
  [148, 546, 72, -90, 0], [136, 631, 56, 180, 270], [212, 641, 68, 0, 90],
  [567, 532, 56, 180, 270], [556, 641, 70, 0, 90], [650, 525, 79, -90, 0], [170, 972, 50, -90, 0],
];
for (const [hx, hy, r, a0, a1] of doors) {
  const p = a => [X(hx + r * Math.cos(a * Math.PI / 180)), Y(hy + r * Math.sin(a * Math.PI / 180))];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  el("path", {class: "door", d: `M${X(hx)},${Y(hy)}L${x0},${y0}A${L(r)},${L(r)} 0 0 1 ${x1},${y1}`}, plan);
}

// 창/문 규격 (px)
const notes = [
  [110, 212, "창문 1500×1200"], [335, 152, "창문 1000×1200"], [435, 152, "창문 600×900"],
  [185, 556, "문 900×2200"], [540, 556, "문 750×2100"], [690, 535, "문 1050×2200"],
  [108, 652, "문 750×2100"], [248, 652, "문 900×2200"], [592, 652, "문 900×2200"],
  [228, 895, "문 1400×2400"], [400, 930, "창문 2600×2000 (커튼박스 180)"], [650, 930, "창문 1800×1200"],
  [80, 1022, "그릴 1100×2100"], [230, 1022, "창문 1300×2000"],
];
for (const [x, y, t] of notes) el("text", {class: "sm", x: X(x), y: Y(y)}, plan, t);

// 치수선 (px 위치, 라벨은 도면 표기값)
const D = el("g", {class: "dim"}, plan);
const dim = (x1, y1, x2, y2, t) => {
  el("line", {x1: X(x1), y1: Y(y1), x2: X(x2), y2: Y(y2)}, D);
  for (const [x, y] of [[x1, y1], [x2, y2]])
    el("line", {x1: X(x) - 80, y1: Y(y) + 80, x2: X(x) + 80, y2: Y(y) - 80}, D);
  const mx = X((x1 + x2) / 2), my = Y((y1 + y2) / 2), v = x1 === x2;
  el("text", v ? {x: mx - 60, y: my, transform: `rotate(-90 ${mx - 60} ${my})`} : {x: mx, y: my - 60}, D, t);
};
const hch = (y, xs, ls) => ls.forEach((t, i) => dim(xs[i], y, xs[i + 1], y, t));
dim(25, 401, 231, 401, "2600");
hch(435, [25, 148, 222], ["1600", "1000"]);
hch(401, [231, 290, 389, 445], ["700", "1300", "700"]);
dim(184, 243, 184, 459, "2850");
dim(328, 233, 328, 402, "2550");
dim(328, 402, 328, 546, "1600");
dim(184, 467, 184, 546, "1020");
hch(577, [148, 238, 389, 628], ["1200", "2000", "3150"]);
dim(148, 607, 299, 607, "2000");
dim(540, 607, 628, 607, "1150");
dim(483, 546, 483, 630, "1100");
dim(184, 641, 184, 869, "3000");
dim(483, 630, 483, 895, "3500");
dim(691, 641, 691, 690, "650");
dim(691, 690, 691, 895, "2700");
dim(741, 641, 741, 895, "3350");
hch(838, [25, 284], ["3400"]);
hch(838, [299, 540], ["3200"]);
hch(838, [556, 768], ["2800"]);

// 원본 겹쳐보기
const img = el("image", {href: "floorplan_55_ref.jpg", x: X(0), y: Y(0), width: L(794), height: L(1123),
  opacity: 0, style: "pointer-events:none"});
const op = document.getElementById("op"), ex = document.getElementById("ex");
const upd = () => {
  img.setAttribute("opacity", op.value / 100);
  img.style.mixBlendMode = ex.checked ? "multiply" : "normal";
  img.style.filter = ex.checked ? "sepia(1) saturate(8) hue-rotate(-50deg)" : "none";
  document.getElementById("vec").style.filter = ex.checked ? "sepia(1) saturate(6) hue-rotate(170deg)" : "none";
};
op.oninput = upd; ex.onchange = () => { if (ex.checked && op.value == 0) op.value = 60; upd(); };
</script>
</body>
</html>
